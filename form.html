<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
     <header id="header" class="header"></header>
    <main>
        <section class="formulario">
    <h2>Formulario de Contacto</h2>
    <form id="contactoForm" novalidate>
      <div class="campo">
        <label for="nombre">Nombre </label>
        <input type="text" id="nombre" />
        <div class="error" id="errorNombre"></div>
      </div>

      <div class="campo">
        <label for="apellido">Apellido </label>
        <input type="text" id="apellido" />
        <div class="error" id="errorApellido"></div>
      </div>

      <div class="campo">
        <label for="email">Email </label>
        <input type="email" id="email" />
        <div class="error" id="errorEmail"></div>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono </label>
        <input type="tel" id="telefono" />
        <div class="error" id="errorTelefono"></div>
      </div>

      <div class="campo">
        <label for="motivo">Motivo </label>
        <select id="motivo">
          <option value="">Seleccioná un motivo</option>
          <option value="consulta">Consulta</option>
          <option value="reclamo">Reclamo</option>
          <option value="felicitacion">Felicitación</option>
        </select>
        <div class="error" id="errorMotivo"></div>
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="4"></textarea>
        <div class="error" id="errorMensaje"></div>
      </div>

      <button type="submit">Enviar</button>
    </form>
  </section>
    </main>
    <footer id="footer" class="footer"></footer>


   <script src="./main.js"></script>
</body>
</html>
